    <text x="1190" y="468" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Amazon Aurora</text>
    <text x="1190" y="498" text-anchor="middle" fill="#eef0ff" font-size="22">Customer / Decision DB</text>

    <rect x="1080" y="560" rx="18" ry="18" width="220" height="95" fill="#38336b"/>
    <text x="1190" y="598" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Amazon S3</text>
    <text x="1190" y="628" text-anchor="middle" fill="#eef0ff" font-size="22">Feature Store / Lake</text>

