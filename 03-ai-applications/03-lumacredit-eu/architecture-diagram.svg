    <text x="1195" y="205" text-anchor="middle" fill="#eef0ff" font-size="22">SageMaker</text>

    <rect x="1080" y="270" rx="18" ry="18" width="230" height="90" fill="#38336b"/>
    <text x="1195" y="305" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Rules Engine</text>
    <text x="1195" y="335" text-anchor="middle" fill="#eef0ff" font-size="22">Policy Layer</text>

    <rect x="1080" y="390" rx="18" ry="18" width="230" height="95" fill="#4a4587"/>
    <text x="1195" y="428" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Third-Party Credit</text>
