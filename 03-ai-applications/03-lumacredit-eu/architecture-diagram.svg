    <line x1="990" y1="235" x2="1080" y2="185"/>
    <line x1="990" y1="275" x2="1080" y2="315"/>
    <line x1="990" y1="290" x2="1080" y2="425"/>
    <line x1="855" y1="310" x2="855" y2="430"/>
    <line x1="990" y1="470" x2="1080" y2="470"/>
    <line x1="990" y1="510" x2="1080" y2="600"/>
    <line x1="855" y1="525" x2="855" y2="690"/>
    <line x1="990" y1="735" x2="1080" y2="735"/>
    <line x1="1310" y1="315" x2="1380" y2="295"/>
    <line x1="1310" y1="455" x2="1380" y2="455"/>
