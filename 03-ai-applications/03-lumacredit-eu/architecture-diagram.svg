    <text x="1190" y="725" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Core Lending</text>
    <text x="1190" y="755" text-anchor="middle" fill="#eef0ff" font-size="22">Platform</text>

    <rect x="1380" y="250" rx="18" ry="18" width="150" height="90" fill="#38336b"/>
