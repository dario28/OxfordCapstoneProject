    <text x="200" y="285" text-anchor="middle" fill="#eef0ff" font-size="22">Lending App</text>

    <rect x="400" y="220" rx="18" ry="18" width="220" height="90" fill="#38336b"/>
    <text x="510" y="255" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Amazon API</text>
    <text x="510" y="285" text-anchor="middle" fill="#eef0ff" font-size="22">Gateway</text>

    <rect x="720" y="200" rx="18" ry="18" width="270" height="110" fill="#38336b"/>
    <text x="855" y="245" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Decision Service</text>
    <text x="855" y="280" text-anchor="middle" fill="#eef0ff" font-size="22">Amazon ECS</text>

    <rect x="1080" y="140" rx="18" ry="18" width="230" height="90" fill="#38336b"/>
