    <text x="1095" y="535" text-anchor="middle" fill="#eef0ff" font-size="22">Retrieval Index</text>

    <rect x="1260" y="470" rx="18" ry="18" width="210" height="90" fill="#38336b"/>
    <text x="1365" y="505" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Amazon S3</text>
    <text x="1365" y="535" text-anchor="middle" fill="#eef0ff" font-size="22">Knowledge Base</text>

