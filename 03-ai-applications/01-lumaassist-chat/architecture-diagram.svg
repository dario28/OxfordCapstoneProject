    <line x1="1190" y1="285" x2="1260" y2="255"/>
    <line x1="1190" y1="305" x2="1260" y2="375"/>
    <line x1="820" y1="310" x2="990" y2="470"/>
    <line x1="1210" y1="515" x2="1260" y2="515"/>
    <line x1="765" y1="310" x2="765" y2="640"/>
    <line x1="890" y1="690" x2="980" y2="685"/>
    <line x1="890" y1="700" x2="1190" y2="685"/>
    <line x1="890" y1="710" x2="1400" y2="685"/>
