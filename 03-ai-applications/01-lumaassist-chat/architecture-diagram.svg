    <text x="1085" y="285" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Internal MCP</text>
    <text x="1085" y="315" text-anchor="middle" fill="#eef0ff" font-size="22">Server on ECS</text>

    <rect x="1260" y="210" rx="18" ry="18" width="210" height="90" fill="#38336b"/>
