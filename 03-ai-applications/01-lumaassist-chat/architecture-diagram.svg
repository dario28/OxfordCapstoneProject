    <text x="180" y="295" text-anchor="middle" fill="#eef0ff" font-size="22">Chat</text>

    <rect x="360" y="230" rx="18" ry="18" width="200" height="90" fill="#38336b"/>
    <text x="460" y="265" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Amazon API</text>
    <text x="460" y="295" text-anchor="middle" fill="#eef0ff" font-size="22">Gateway</text>

    <rect x="640" y="210" rx="18" ry="18" width="250" height="100" fill="#38336b"/>
    <text x="765" y="250" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Chat Orchestrator</text>
    <text x="765" y="280" text-anchor="middle" fill="#eef0ff" font-size="22">Amazon ECS</text>

    <rect x="980" y="130" rx="18" ry="18" width="210" height="90" fill="#38336b"/>
