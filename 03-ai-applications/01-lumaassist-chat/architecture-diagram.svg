<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#14113a"/>
  <text x="80" y="90" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">LumaAssist Chat Architecture</text>
  <text x="80" y="130" fill="#cfd2ff" font-family="Arial, Helvetica, sans-serif" font-size="22">Customer-facing LLM assistant with internal MCP tools</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
